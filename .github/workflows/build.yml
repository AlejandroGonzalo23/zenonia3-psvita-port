name: Build Zenonia 3 VPK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone missing dependencies (FalsoJNI)
        run: |
          mkdir -p lib
          if [ ! -d "lib/falso_jni" ]; then
            git clone https://github.com/SonicMastr/FalsoJNI.git lib/falso_jni
          fi

      - name: Build VPK
        run: |
          mkdir build && cd build
          cmake -G "Unix Makefiles" ..
          make

      - name: Upload VPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenonia3-VPK
          path: |
            build/*.vpk
            build/*.bin
            build/*.self
            build/eboot.bin
