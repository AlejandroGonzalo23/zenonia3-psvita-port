name: Build Zenonia 3 VPK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools & vitaGL
        run: |
          apk update && apk add --no-cache cmake make ninja gcc g++
          vdpm https://github.com/Rinnegatamante/vitaGL

      - name: Build VPK
        run: |
          mkdir build && cd build
          cmake -G "Unix Makefiles" ..
          make

      - name: Upload VPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenonia3-VPK
          path: |
            build/*.vpk
            build/*.bin
